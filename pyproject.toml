[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-json-parser"
version = "0.1.0"
description = "一个为了让人读懂而写的 JSON 解析器（零依赖、含报错定位与 trace 教学模式）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "代思睿", email = "cixia222@users.noreply.github.com" }]
keywords = ["json", "parser", "educational", "tokenizer", "recursive-descent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/cixia222/Small-JSON-parser_55"
Issues = "https://github.com/cixia222/Small-JSON-parser_55/issues"

[project.scripts]
mjson = "mjson.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
